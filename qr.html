<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein PDF QR-Code</title>
</head>
<body>

    <h1>Meine PDF</h1>

    <div id="qrcode"></div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "https://mohaziz03.github.io/meine-webseite/test-menu.pdf",
            width: 250,
            height: 250
        });
    </script>

</body>
</html>
